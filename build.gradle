plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id + ',cities_arise_readiness,cities_arise_roads,cities_arise_budget'
        }

        seedSearch {
            type = 'gameTestServer'
            gameDirectory = file(providers.gradleProperty('seedSearchWorkDir').getOrElse('build/seed-search/runtime'))
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cities_arise_seed_search'
            systemProperty 'citiesarise.seedSearchOptions', providers.gradleProperty('seedSearchOptions').getOrElse('')
        }

        planningBenchmark {
            type = 'gameTestServer'
            gameDirectory = file('build/planning-benchmark/runtime')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'cities_arise_planning_benchmark'
            systemProperty 'citiesarise.benchmarkLabel', providers.gradleProperty('planningBenchmarkLabel').getOrElse('current')
            systemProperty 'citiesarise.benchmarkCompareBaseline', providers.gradleProperty('planningBenchmarkCompareBaseline').getOrElse('true')
            systemProperty 'citiesarise.benchmarkDatapack', providers.gradleProperty('planningBenchmarkDatapack').getOrElse('../../../examples/datapacks/zoning_fixture/data')
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').absolutePath, '--existing', file('src/main/resources/').absolutePath
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

tasks.named('processGameTestResources') {
    from('src/gameTest/resources/data/cities_arise/structure') {
        into 'data/cities_arise_readiness/structure'
    }
    from('src/gameTest/resources/data/cities_arise/structure') {
        into 'data/cities_arise_planning_benchmark/structure'
    }
    from('src/gameTest/resources/data/cities_arise/structure') {
        into 'data/cities_arise_seed_search/structure'
    }
    from('examples/datapacks/composition_fixture') {
        include 'data/test/**'
    }
    from('examples/datapacks/zoning_fixture') {
        include 'data/zoning/**'
    }
    from('examples/datapacks/road_topology') {
        include 'data/road_demo/**'
    }
    from('src/gameTest/resources/data/cities_arise/structure') {
        into 'data/cities_arise_roads/structure'
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    // Full skyline-grid acceptance constructs eighty broad buildings in one plan.
    maxHeapSize = '2g'
    useJUnitPlatform()
    inputs.dir('examples/datapacks')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
}

tasks.register('roadTopologyDatapack', Zip) {
    from('examples/datapacks/road_topology')
    archiveFileName = 'road_topology.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

// Authored road definitions are available to profile fixtures without packaging test content in the mod.
tasks.named('processTestResources') {
    from('examples/datapacks/skyline') { include 'data/skyline/road_layouts/**' }
}
tasks.named('processGameTestResources') {
    from('examples/datapacks/skyline') { include 'data/skyline/road_layouts/**' }
}

tasks.named('processGameTestResources') {
    from('examples/datapacks/skyline/data/cities_arise/settlement_profiles/suburb.json') { into 'fixtures/skyline' }
}

// Bounded placement regressions use an isolated namespace for short targeted runs.
tasks.named('processGameTestResources') {
    from('src/gameTest/resources/data/cities_arise/structure') { into 'data/cities_arise_budget/structure' }
}
